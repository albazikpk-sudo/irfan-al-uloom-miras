name: Android Build

on:
  push:
    branches: [main]
    paths:
      - "irfan-al-uloom-miras-source.zip"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract App Source
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q irfan-al-uloom-miras-source.zip -d extracted
          SOURCE_FILE="$(find extracted -type f -name package.json -print -quit)"
          if [ -z "$SOURCE_FILE" ]; then
            echo 'package.json not found in ZIP'
            exit 1
          fi
          SOURCE_DIR="$(dirname "$SOURCE_FILE")"
          cp -a "$SOURCE_DIR"/. .
          rm -f capacitor.config.ts
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.irfanuloom.mirathcalculator",
            "appName": "عرفان العلوم میراث کیلکولیٹر",
            "webDir": "www",
            "android": {
              "allowMixedContent": false
            }
          }
          JSON
          test -f www/index.html
          test -f www/admob.js
          test -d android-icons

      - name: Install Dependencies
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node -e "const p=require('./node_modules/@capacitor-community/admob/package.json'); if(p.version !== '7.0.3') throw new Error('Unexpected AdMob plugin version: ' + p.version); console.log('AdMob plugin version:',p.version)"
          test -s www/admob.bundle.js

      - name: Verify Production AdMob Banner Configuration
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path

          production_id = "ca-app-pub-1134522787126944/5939274618"
          test_id = "ca-app-pub-3940256099942544/6300978111"
          source = Path("www/admob.js").read_text()
          bundle = Path("www/admob.bundle.js").read_text()

          for name, content in (("www/admob.js", source), ("www/admob.bundle.js", bundle)):
              if production_id not in content:
                  raise SystemExit(f"Production Banner ID missing from {name}")
              if test_id in content:
                  raise SystemExit(f"Test Banner ID found in {name}; refusing production build")
          if "isTesting: false" not in source:
              raise SystemExit("Production mode is not explicitly enabled (isTesting: false)")
          print("Production AdMob Banner ID and live mode verified in source and bundle.")
          PYTHON

      - name: Add Android
        run: npx cap add android

      - name: Set Minimum Android SDK to 24
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          p = Path("android/variables.gradle")
          if not p.is_file():
              raise SystemExit("android/variables.gradle not found")
          content = p.read_text()
          pattern = r"(?m)^(\s*minSdkVersion\s*=\s*)23(\s*)$"
          updated, count = re.subn(pattern, r"\g<1>24\g<2>", content)
          if count != 1:
              raise SystemExit(f"Expected exactly one minSdkVersion = 23 entry; found {count}")
          p.write_text(updated)
          print("minSdkVersion updated from 23 to 24")
          PYTHON

      - name: Install App Icons
        run: cp -a android-icons/. android/app/src/main/res/

      - name: Sync Android
        run: npx cap sync android

      - name: Configure and Verify AdMob App ID
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          app_id = "ca-app-pub-1134522787126944~8149525042"
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)

          # Add/update the string resource expected by the AdMob plugin manifest entry.
          values_dir = Path("android/app/src/main/res/values")
          values_dir.mkdir(parents=True, exist_ok=True)
          strings_file = values_dir / "strings.xml"
          if strings_file.exists():
              strings_tree = ET.parse(strings_file)
              strings_root = strings_tree.getroot()
          else:
              strings_root = ET.Element("resources")
              strings_tree = ET.ElementTree(strings_root)
          app_id_nodes = [node for node in strings_root.findall("string") if node.get("name") == "admob_app_id"]
          if app_id_nodes:
              app_id_nodes[0].text = app_id
              for duplicate in app_id_nodes[1:]:
                  strings_root.remove(duplicate)
          else:
              node = ET.SubElement(strings_root, "string", {"name": "admob_app_id"})
              node.text = app_id
          ET.indent(strings_tree, space="    ")
          strings_tree.write(strings_file, encoding="utf-8", xml_declaration=True)

          # Add/update the required Google Mobile Ads application metadata.
          manifest_file = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest_file.is_file():
              raise SystemExit("AndroidManifest.xml not found")
          manifest_tree = ET.parse(manifest_file)
          manifest_root = manifest_tree.getroot()
          application = manifest_root.find("application")
          if application is None:
              raise SystemExit("<application> element not found in AndroidManifest.xml")
          key = f"{{{android_ns}}}name"
          value_key = f"{{{android_ns}}}value"
          matches = [node for node in application.findall("meta-data") if node.get(key) == "com.google.android.gms.ads.APPLICATION_ID"]
          if matches:
              matches[0].set(value_key, "@string/admob_app_id")
              for duplicate in matches[1:]:
                  application.remove(duplicate)
          else:
              ET.SubElement(application, "meta-data", {
                  key: "com.google.android.gms.ads.APPLICATION_ID",
                  value_key: "@string/admob_app_id"
              })
          ET.indent(manifest_tree, space="    ")
          manifest_tree.write(manifest_file, encoding="utf-8", xml_declaration=True)

          # Read back and fail the workflow if either setting is missing/wrong.
          check_strings = ET.parse(strings_file).getroot()
          found_id = next((n.text for n in check_strings.findall("string") if n.get("name") == "admob_app_id"), None)
          check_manifest = ET.parse(manifest_file).getroot()
          check_app = check_manifest.find("application")
          found_meta = [n for n in check_app.findall("meta-data") if n.get(key) == "com.google.android.gms.ads.APPLICATION_ID"]
          if found_id != app_id or len(found_meta) != 1 or found_meta[0].get(value_key) != "@string/admob_app_id":
              raise SystemExit("AdMob Android configuration verification failed")
          print("AdMob App ID resource and AndroidManifest metadata verified")
          PYTHON

      - name: Verify Android package name
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          if not p.is_file():
              raise SystemExit("android/app/build.gradle not found")
          content = p.read_text()
          ids = re.findall(r'''(?m)^\s*applicationId\s+["']([^"']+)["']''', content)
          expected = "com.irfanuloom.mirathcalculator"
          if len(ids) != 1 or ids[0] != expected:
              raise SystemExit(f"Package name mismatch: found {ids!r}; expected {expected!r}")
          print(f"Verified Android applicationId: {ids[0]}")
          PYTHON

      - name: Configure Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/miras-upload-key.jks"
          test -s "$RUNNER_TEMP/miras-upload-key.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/miras-upload-key.jks"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          if not p.exists():
              raise SystemExit('android/app/build.gradle not found')
          s = p.read_text()
          if 'signingConfigs {' in s and 'signingConfig signingConfigs.release' in s:
              raise SystemExit('Release signing configuration already exists; refusing to duplicate it')
          if not re.search(r'(?m)^\s*buildTypes\s*\{', s):
              raise SystemExit('Could not locate buildTypes block in app/build.gradle')
          signing = '''    signingConfigs {
              release {
                  storeFile file(System.getenv("KEYSTORE_FILE"))
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }
          '''
          s = re.sub(r'(?m)^(\s*)buildTypes\s*\{', lambda m: signing + m.group(0), s, count=1)
          bt = re.search(r'(?m)^\s*buildTypes\s*\{', s)
          m = re.search(r'(?m)^(\s*)release\s*\{', s[bt.end():]) if bt else None
          if not m:
              raise SystemExit('Could not locate release buildType in app/build.gradle')
          insert_at = bt.end() + m.end()
          s = s[:insert_at] + '\n            signingConfig signingConfigs.release' + s[insert_at:]
          p.write_text(s)
          PY
          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Build Signed AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/miras-upload-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Check Signed AAB exists
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          echo "Signed AAB file exists: $AAB"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Irfan-Al-Uloom-Miras-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Irfan-Al-Uloom-Miras-AAB-signed
          path: android/app/build/outputs/bundle/release/app-release.aab
