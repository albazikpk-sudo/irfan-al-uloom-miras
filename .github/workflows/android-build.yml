
name: Android Build

on:
  push:
    branches:
      - main
    paths:
      - "irfan-al-uloom-miras-source.zip"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract App Source
        shell: bash
        run: |
          set -euo pipefail

          test -f irfan-al-uloom-miras-source.zip

          mkdir -p extracted

          unzip -q irfan-al-uloom-miras-source.zip -d extracted

          SOURCE_FILE="$(find extracted -type f -name package.json -print -quit)"

          if [ -z "$SOURCE_FILE" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          SOURCE_DIR="$(dirname "$SOURCE_FILE")"

          cp -a "$SOURCE_DIR"/. .

          rm -f capacitor.config.ts capacitor.config.js

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.irfanuloom.mirathcalculator",
            "appName": "میراث کیلکولیٹر",
            "webDir": "www",
            "android": {
              "allowMixedContent": false
            }
          }
          JSON

          test -f package.json
          test -f www/index.html
          test -f www/admob.js
          test -d android-icons

          echo "Source extraction successful"

      - name: Install Dependencies
        run: |
          set -euo pipefail

          npm install --no-audit --no-fund

          node -e "
          const p = require('./node_modules/@capacitor/core/package.json');
          if (p.version !== '7.4.3') {
            throw new Error('Capacitor version mismatch: ' + p.version);
          }
          console.log('Capacitor:', p.version);
          "

          node -e "
          const p = require('./node_modules/@capacitor/android/package.json');
          if (p.version !== '7.4.3') {
            throw new Error('Android version mismatch: ' + p.version);
          }
          console.log('Capacitor Android:', p.version);
          "

          node -e "
          const p = require('./node_modules/@capacitor-community/admob/package.json');
          if (p.version !== '7.0.3') {
            throw new Error('AdMob version mismatch: ' + p.version);
          }
          console.log('AdMob:', p.version);
          "

          test -s www/admob.bundle.js

      - name: Verify Production AdMob Configuration
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path

          production_id = "ca-app-pub-1134522787126944/5939274618"
          test_id = "ca-app-pub-3940256099942544/6300978111"

          source = Path("www/admob.js").read_text()
          bundle = Path("www/admob.bundle.js").read_text()

          for name, content in (
              ("www/admob.js", source),
              ("www/admob.bundle.js", bundle)
          ):
              if production_id not in content:
                  raise SystemExit(f"Production Banner ID missing: {name}")

              if test_id in content:
                  raise SystemExit(f"Test Banner ID found: {name}")

          if "isTesting: false" not in source:
              raise SystemExit("Production mode is not enabled")

          print("Production AdMob configuration verified")
          PYTHON

      - name: Add Android Platform
        run: npx cap add android

      - name: Set Android Version Code
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")

          if not p.is_file():
              raise SystemExit("build.gradle not found")

          content = p.read_text()

          updated, count = re.subn(
              r"(?m)^(\s*versionCode\s+)\d+(\s*)$",
              r"\g<1>6\g<2>",
              content
          )

          if count != 1:
              raise SystemExit(
                  f"Expected one versionCode entry, found {count}"
              )

          p.write_text(updated)

          check = re.search(
              r"(?m)^\s*versionCode\s+(\d+)",
              p.read_text()
          )

          if not check or check.group(1) != "6":
              raise SystemExit("Version Code verification failed")

          print("Version Code 6 verified")
          PYTHON

      - name: Configure Android SDK 24 / 36
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          p = Path("android/variables.gradle")

          if not p.is_file():
              raise SystemExit("variables.gradle not found")

          content = p.read_text()

          settings = {
              "minSdkVersion": 24,
              "compileSdkVersion": 36,
              "targetSdkVersion": 36
          }

          for key, value in settings.items():
              pattern = rf"(?m)^(\s*{key}\s*=\s*)\d+(\s*)$"

              content, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + str(value) + m.group(2),
                  content
              )

              if count != 1:
                  raise SystemExit(
                      f"Expected one {key} entry, found {count}"
                  )

          p.write_text(content)

          for key, value in settings.items():
              match = re.search(
                  rf"(?m)^\s*{key}\s*=\s*(\d+)",
                  content
              )

              if not match or int(match.group(1)) != value:
                  raise SystemExit(f"{key} verification failed")

          print("minSdkVersion = 24")
          print("compileSdkVersion = 36")
          print("targetSdkVersion = 36")
          PYTHON

      - name: Configure Android Gradle Versions
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          build = Path("android/build.gradle")

          if not build.is_file():
              raise SystemExit("android/build.gradle not found")

          content = build.read_text()

          pattern = (
              r"com\.android\.tools\.build:gradle:[0-9.]+"
          )

          updated, count = re.subn(
              pattern,
              "com.android.tools.build:gradle:8.9.1",
              content
          )

          if count != 1:
              raise SystemExit(
                  f"Expected one Android Gradle Plugin dependency, found {count}"
              )

          build.write_text(updated)

          wrapper = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          if not wrapper.is_file():
              raise SystemExit("Gradle wrapper not found")

          content = wrapper.read_text()

          updated, count = re.subn(
              r"(?m)^distributionUrl\s*=.*$",
              lambda m: (
                  "distributionUrl=https://services.gradle.org/"
                  "distributions/gradle-8.11.1-bin.zip"
              ),
              content
          )

          if count != 1:
              raise SystemExit("Gradle distribution URL update failed")

          wrapper.write_text(updated)

          if "gradle-8.11.1-bin.zip" not in wrapper.read_text():
              raise SystemExit("Gradle wrapper verification failed")

          print("Android Gradle Plugin 8.9.1 verified")
          print("Gradle 8.11.1 verified")
          PYTHON

      - name: Install App Icons
        run: |
          set -euo pipefail
          cp -a android-icons/. android/app/src/main/res/
          echo "App icons installed"

      - name: Sync Android
        run: |
          set -euo pipefail
          npx cap sync android

      - name: Configure App Name and Advertising Permission
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          ns = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", ns)

          values = Path("android/app/src/main/res/values")
          values.mkdir(parents=True, exist_ok=True)

          strings = values / "strings.xml"

          if strings.exists():
              tree = ET.parse(strings)
          else:
              tree = ET.ElementTree(
                  ET.Element("resources")
              )

          root = tree.getroot()

          matches = [
              x for x in root.findall("string")
              if x.get("name") == "app_name"
          ]

          if matches:
              matches[0].text = "میراث کیلکولیٹر"

              for x in matches[1:]:
                  root.remove(x)
          else:
              ET.SubElement(
                  root,
                  "string",
                  {"name": "app_name"}
              ).text = "میراث کیلکولیٹر"

          ET.indent(tree, space="    ")

          tree.write(
              strings,
              encoding="utf-8",
              xml_declaration=True
          )

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          tree = ET.parse(manifest)
          root = tree.getroot()

          permission = "com.google.android.gms.permission.AD_ID"

          matches = [
              x for x in root.findall("uses-permission")
              if x.get(f"{{{ns}}}name") == permission
          ]

          if not matches:
              ET.SubElement(
                  root,
                  "uses-permission",
                  {f"{{{ns}}}name": permission}
              )

          for x in matches[1:]:
              root.remove(x)

          ET.indent(tree, space="    ")

          tree.write(
              manifest,
              encoding="utf-8",
              xml_declaration=True
          )

          print("App name and AD_ID permission verified")
          PYTHON

      - name: Configure AdMob App ID
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          app_id = "ca-app-pub-1134522787126944~8149525042"

          ns = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", ns)

          values = Path("android/app/src/main/res/values")
          values.mkdir(parents=True, exist_ok=True)

          strings = values / "strings.xml"

          if strings.exists():
              tree = ET.parse(strings)
          else:
              tree = ET.ElementTree(
                  ET.Element("resources")
              )

          root = tree.getroot()

          matches = [
              x for x in root.findall("string")
              if x.get("name") == "admob_app_id"
          ]

          if matches:
              matches[0].text = app_id

              for x in matches[1:]:
                  root.remove(x)
          else:
              ET.SubElement(
                  root,
                  "string",
                  {"name": "admob_app_id"}
              ).text = app_id

          ET.indent(tree, space="    ")

          tree.write(
              strings,
              encoding="utf-8",
              xml_declaration=True
          )

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          tree = ET.parse(manifest)
          root = tree.getroot()

          application = root.find("application")

          if application is None:
              raise SystemExit("Application element not found")

          key = f"{{{ns}}}name"
          value_key = f"{{{ns}}}value"

          metadata_name = (
              "com.google.android.gms.ads.APPLICATION_ID"
          )

          matches = [
              x for x in application.findall("meta-data")
              if x.get(key) == metadata_name
          ]

          if matches:
              matches[0].set(
                  value_key,
                  "@string/admob_app_id"
              )

              for x in matches[1:]:
                  application.remove(x)
          else:
              ET.SubElement(
                  application,
                  "meta-data",
                  {
                      key: metadata_name,
                      value_key: "@string/admob_app_id"
                  }
              )

          ET.indent(tree, space="    ")

          tree.write(
              manifest,
              encoding="utf-8",
              xml_declaration=True
          )

          check = ET.parse(strings).getroot()

          found = [
              x.text for x in check.findall("string")
              if x.get("name") == "admob_app_id"
          ]

          if found != [app_id]:
              raise SystemExit("AdMob App ID verification failed")

          print("AdMob App ID successfully configured")
          PYTHON

      - name: Verify Android Package Name
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")

          if not p.is_file():
              raise SystemExit("build.gradle not found")

          content = p.read_text()

          ids = re.findall(
              r'''(?m)^\s*applicationId\s+["']([^"']+)["']''',
              content
          )

          expected = "com.irfanuloom.mirathcalculator"

          if len(ids) != 1 or ids[0] != expected:
              raise SystemExit(
                  f"Package mismatch: {ids}; expected {expected}"
              )

          print("Package ID verified:", expected)
          PYTHON

      - name: Configure Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          KEYSTORE_FILE="$RUNNER_TEMP/miras-upload-key.jks"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE"

          export KEYSTORE_FILE

          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")

          if not p.is_file():
              raise SystemExit("build.gradle not found")

          s = p.read_text()

          if re.search(r"(?m)^\s*signingConfigs\s*\{", s):
              raise SystemExit(
                  "Signing configuration already exists; refusing to duplicate"
              )

          bt = re.search(
              r"(?m)^(\s*)buildTypes\s*\{",
              s
          )

          if not bt:
              raise SystemExit("buildTypes block not found")

          release = re.search(
              r"(?m)^(\s*)release\s*\{",
              s[bt.end():]
          )

          if not release:
              raise SystemExit("Release buildType not found")

          signing = """
          signingConfigs {
              release {
                  storeFile file(System.getenv("KEYSTORE_FILE"))
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }

          """

          s = s[:bt.start()] + signing + s[bt.start():]

          bt = re.search(
              r"(?m)^(\s*)buildTypes\s*\{",
              s
          )

          release = re.search(
              r"(?m)^(\s*)release\s*\{",
              s[bt.end():]
          )

          if not release:
              raise SystemExit("Release block not found")

          insert_at = bt.end() + release.end()

          s = (
              s[:insert_at]
              + "\n            signingConfig signingConfigs.release\n"
              + s[insert_at:]
          )

          p.write_text(s)

          check = p.read_text()

          if "signingConfig signingConfigs.release" not in check:
              raise SystemExit("Release signing verification failed")

          print("Release signing configuration created")
          PYTHON

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          set -euo pipefail

          chmod +x android/gradlew

          cd android

          ./gradlew --no-daemon assembleDebug

      - name: Build Signed Release AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/miras-upload-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -euo pipefail

          cd android

          ./gradlew --no-daemon bundleRelease

      - name: Verify APK and AAB
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -s "$APK"
          test -s "$AAB"

          echo "APK successfully generated"
          echo "AAB successfully generated"

          ls -lh "$APK" "$AAB"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Irfan-Al-Uloom-Miras-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Irfan-Al-Uloom-Miras-AAB-signed
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
