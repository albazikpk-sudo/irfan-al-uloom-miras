name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract App Source
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q irfan-al-uloom-miras-source.zip -d extracted
          SOURCE_FILE="$(find extracted -type f -name package.json -print -quit)"
          if [ -z "$SOURCE_FILE" ]; then
            echo 'package.json not found in ZIP'
            exit 1
          fi
          SOURCE_DIR="$(dirname "$SOURCE_FILE")"
          cp -a "$SOURCE_DIR"/. .
          rm -f capacitor.config.ts
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.irfanululoom.mirathcalculator",
            "appName": "عرفان العلوم میراث کیلکولیٹر",
            "webDir": "www",
            "android": {
              "allowMixedContent": false
            }
          }
          JSON
          test -f www/index.html
          test -d android-icons

      - name: Install Dependencies
        run: |
          npm install
          npm install --save-dev typescript@5.8.3

      - name: Add Android
        run: npx cap add android

      - name: Set Minimum Android SDK to 24
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          p = Path("android/variables.gradle")
          if not p.is_file():
              raise SystemExit("android/variables.gradle not found")

          content = p.read_text()
          pattern = r"(?m)^(\s*minSdkVersion\s*=\s*)23(\s*)$"
          updated, count = re.subn(pattern, r"\g<1>24\g<2>", content)

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one minSdkVersion = 23 entry; found {count}. "
                  "Stopping without changing the file."
              )

          p.write_text(updated)
          print("minSdkVersion updated from 23 to 24")
          PYTHON

      - name: Install App Icons
        run: cp -a android-icons/. android/app/src/main/res/

      - name: Sync Android
        run: npx cap sync android

      - name: Configure Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/miras-upload-key.jks"
          test -s "$RUNNER_TEMP/miras-upload-key.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/miras-upload-key.jks"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          if not p.exists():
              raise SystemExit('android/app/build.gradle not found')
          s = p.read_text()
          if 'signingConfigs {' in s and 'signingConfig signingConfigs.release' in s:
              raise SystemExit('Release signing configuration already exists; refusing to duplicate it')
          if not re.search(r'(?m)^\s*buildTypes\s*\{', s):
              raise SystemExit('Could not locate buildTypes block in app/build.gradle')
          signing = '''    signingConfigs {
          release {
              storeFile file(System.getenv("KEYSTORE_FILE"))
              storePassword System.getenv("KEYSTORE_PASSWORD")
              keyAlias System.getenv("KEY_ALIAS")
              keyPassword System.getenv("KEY_PASSWORD")
          }
          }

          '''
          s = re.sub(r'(?m)^(\s*)buildTypes\s*\{', lambda m: signing + m.group(0), s, count=1)
          bt = re.search(r'(?m)^\s*buildTypes\s*\{', s)
          m = re.search(r'(?m)^(\s*)release\s*\{', s[bt.end():]) if bt else None
          if not m:
              raise SystemExit('Could not locate release buildType in app/build.gradle')
          insert_at = bt.end() + m.end()
          s = s[:insert_at] + '\n            signingConfig signingConfigs.release' + s[insert_at:]
          p.write_text(s)
          PY
          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Build Signed AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/miras-upload-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Check Signed AAB exists
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          echo "Signed AAB file exists: $AAB"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Irfan-Al-Uloom-Miras-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Irfan-Al-Uloom-Miras-AAB-signed
          path: android/app/build/outputs/bundle/release/app-release.aab
