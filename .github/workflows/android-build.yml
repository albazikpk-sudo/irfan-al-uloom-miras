name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract App Source
        run: |
          mkdir -p extracted
          unzip -q irfan-al-uloom-miras-source.zip -d extracted
          SOURCE_DIR="$(dirname "$(find extracted -type f -name package.json -print -quit)")"
          if [ -z "$SOURCE_DIR" ]; then
            echo "package.json not found in ZIP"
            exit 1
          fi
          cp -a "$SOURCE_DIR"/. .
          test -f www/index.html

      - name: Install Dependencies
        run: npm install

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Irfan-Al-Uloom-Miras-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
